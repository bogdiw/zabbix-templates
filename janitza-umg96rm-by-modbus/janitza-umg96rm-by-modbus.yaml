  - uuid: cec22672e0924f3580b43e318c82f1e7
    template: Janitza UMG96RM-E by Modbus
    name: Janitza UMG96RM-E by Modbus
    description: Janitza UMG96RM-E power meter via Modbus TCP. 61 holding registers (FLOAT32 ABCD, big-endian) starting at
      19000. Requires Zabbix agent 2 with modbus plugin reachable from the Zabbix server. Set {$MODBUS.HOST} = tcp://<meter-ip>:502
      and {$MODBUS.SLAVE} per host.
    groups:
    - name: Templates/HVAC
    items:
    - uuid: ab41f50833e149cba62cdea69ad3c7d3
      name: 'Meter: Voltage L1-N'
      type: ZABBIX_ACTIVE
      key: modbus.get[{$MODBUS.HOST},{$MODBUS.SLAVE},3,19000,1,float,be]
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $[0]
      tags:
      - tag: class
        value: meter
      - tag: vendor
        value: janitza
      units: V
