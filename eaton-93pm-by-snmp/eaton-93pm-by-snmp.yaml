        - tag: phase
          value: '{#PHASE}'
      - uuid: b6b6366ce17d4242941101b8f47e3f75
        name: 'Output phase {#PHASE}: Current'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.534.1.4.4.1.3.{#SNMPINDEX}
        key: ups.output.phase.current_a[{#SNMPINDEX}]
