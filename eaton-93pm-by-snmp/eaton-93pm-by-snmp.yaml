    valuemaps:
    - uuid: f13fa31206e545aa9b282766eb0408d9
      name: Eaton XUPS battery ABM status
      mappings:
      - value: '1'
        newvalue: Charging
      - value: '2'
        newvalue: Discharging
      - value: '3'
        newvalue: Floating
      - value: '4'
        newvalue: Resting
      - value: '5'
        newvalue: Unknown
    - uuid: 8d0bc782790d497693ad07423f3311bc
      name: Eaton XUPS input source
      mappings:
      - value: '1'
        newvalue: None
      - value: '2'
        newvalue: Primary utility
      - value: '3'
        newvalue: Bypass
      - value: '4'
        newvalue: Secondary utility
      - value: '5'
        newvalue: Generator
      - value: '6'
        newvalue: Flywheel
      - value: '7'
        newvalue: Fuel cell
    - uuid: fc4f7ae6c72740f2997eb0ce88c582d7
      name: Eaton XUPS output source
      mappings:
      - value: '1'
        newvalue: Other
      - value: '2'
        newvalue: None
      - value: '3'
        newvalue: Normal
      - value: '4'
        newvalue: Bypass
      - value: '5'
        newvalue: Battery
      - value: '6'
        newvalue: Booster
      - value: '7'
        newvalue: Reducer
      - value: '8'
        newvalue: Parallel capacity
      - value: '9'
        newvalue: Parallel redundant
      - value: '10'
        newvalue: High efficiency mode
      - value: '11'
        newvalue: Maintenance bypass
      - value: '12'
        newvalue: ESS
    - uuid: 76d7eb1b8f7d456c9394545823b22421
      name: Eaton XUPS battery test status
      mappings:
      - value: '1'
        newvalue: Unknown
      - value: '2'
        newvalue: Passed
      - value: '3'
        newvalue: Failed
      - value: '4'
        newvalue: In progress
      - value: '5'
        newvalue: Not supported
      - value: '6'
        newvalue: Inhibited
      - value: '7'
        newvalue: Scheduled
    macros:
    - macro: '{$SNMP_COMMUNITY}'
      value: public
      description: SNMPv2c community string
  triggers:
  - uuid: 441d9c3a397749ca8529f0c656a2b120
    expression: last(/Eaton 93PM by SNMP/ups.battery.runtime_s)<300
    name: UPS battery runtime under 5min on {HOST.NAME}
    priority: HIGH
  - uuid: 1845e1a85fa14e179ab55b6898dcf596
    expression: last(/Eaton 93PM by SNMP/ups.battery.capacity_pct)<50
    name: UPS battery below 50% on {HOST.NAME}
    priority: WARNING
  - uuid: 3dba7eb98be24033839b5a5ad1050100
    expression: last(/Eaton 93PM by SNMP/ups.battery.capacity_pct)<20
    name: UPS battery below 20% on {HOST.NAME}
    priority: HIGH
  - uuid: de986e0131524f5ea7dcfa4fd612dedd
    expression: last(/Eaton 93PM by SNMP/ups.battery.abm_status)=2
    name: UPS on battery (discharging) on {HOST.NAME}
    priority: HIGH
  - uuid: 7284a34a41074de8b2fd166c49e121ce
    expression: last(/Eaton 93PM by SNMP/ups.output.load_pct)>80
    name: UPS load above 80% on {HOST.NAME}
    priority: WARNING
  - uuid: 68cd52e3ad5f4f2ea66a2bb7931dade4
    expression: last(/Eaton 93PM by SNMP/ups.output.source)<>3
    name: UPS output not normal on {HOST.NAME}
