    discovery_rules:
    - uuid: baa856b50f2a4575bab9bcf0b31748d3
      name: Input phases discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#PHASE},1.3.6.1.4.1.534.1.3.4.1.1]
      key: ups.input.phase.discovery
      delay: 5m
      item_prototypes:
      - uuid: c5013bc6d50b4fbdaa03708d6b96fb64
        name: 'Input phase {#PHASE}: Voltage'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.534.1.3.4.1.2.{#SNMPINDEX}
        key: ups.input.phase.voltage_v[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: V
        tags:
        - tag: class
          value: ups
        - tag: vendor
          value: eaton
        - tag: phase
          value: '{#PHASE}'
      - uuid: a97af6e9634e4b99a4a54862622f2661
        name: 'Input phase {#PHASE}: Current'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.534.1.3.4.1.3.{#SNMPINDEX}
        key: ups.input.phase.current_a[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: FLOAT
        units: A
        tags:
        - tag: class
          value: ups
        - tag: vendor
          value: eaton
        - tag: phase
          value: '{#PHASE}'
      - uuid: cf19d09e09cb4e75b0939450733d3959
        name: 'Input phase {#PHASE}: Active power'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.4.1.534.1.3.4.1.4.{#SNMPINDEX}
        key: ups.input.phase.watts_w[{#SNMPINDEX}]
        delay: 1m
        history: 31d
        trends: 365d
        value_type: UNSIGNED
        units: W
        tags:
        - tag: class
