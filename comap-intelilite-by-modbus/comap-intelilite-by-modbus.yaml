zabbix_export:
  version: '7.2'
  template_groups:
  - uuid: e4ba987200b54b2a83f2050f6e71f0da
    name: Templates/HVAC
  templates:
  - uuid: 7d03b41cfd1748b99c780497218d3faa
    template: ComAp InteliLite by Modbus
    name: ComAp InteliLite by Modbus
    description: "ComAp InteliLite NT AMF26P alerts — reads from InfluxDB via HTTP\
      \ Flux queries.\nNO direct Modbus polling — Telegraf is the sole Modbus client\
      \ (IB-Lite is 1-client only).\nPer-host override: {$INFLUX.HOST} = generator-a\
      \ or generator-b.\nSet {$INFLUX.TOKEN} as secret text — mint via:\n  influx\
      \ auth create --org cloudxedge --read-bucket 3d6b114d4c2b08c9 --description\
      \ zabbix-readonly\nIndustry-standard alerts (NFPA 110, ISO 8528-5) with engine_state\
      \ gating."
    groups:
    - name: Templates/HVAC
    macros:
    - macro: '{$INFLUX.URL}'
      value: http://10.1.250.30:30086
      description: InfluxDB v2 base URL (NodePort on logmon-k8s)
    - macro: '{$INFLUX.ORG}'
      value: cloudxedge
      description: InfluxDB organization
    - macro: '{$INFLUX.TOKEN}'
      value: PLACEHOLDER_OVERRIDE_PER_HOST_OR_TEMPLATE
      description: 'InfluxDB read-only token (mint with: influx auth create --read-bucket
        <id>)'
      type: SECRET_TEXT
    - macro: '{$INFLUX.HOST}'
      value: generator-a
      description: Telegraf host tag for this gen (generator-a / generator-b)
    - macro: '{$GEN.NOMINAL.RPM}'
      value: '1500'
      description: Nominal RPM (1500=50Hz, 1800=60Hz)
    - macro: '{$GEN.NOMINAL.V.LN}'
      value: '230'
      description: Nominal phase voltage L-N
    - macro: '{$GEN.OVERSPEED.PCT}'
      value: '110'
      description: Overspeed threshold (%)
    - macro: '{$GEN.UNDERSPEED.PCT}'
      value: '95'
      description: Underspeed under-load threshold (%)
    - macro: '{$BATT.LOW.WARN}'
      value: '11.8'
      description: Battery low warning (V) — default for 12V system; override to 23.5
        for 24V
    - macro: '{$BATT.LOW.CRIT}'
      value: '11.5'
      description: Battery critical (V) — default for 12V; override to 22.5 for 24V
    - macro: '{$BATT.HIGH}'
      value: '15.5'
      description: Battery overvoltage (V) — default for 12V; override to 30.0 for
        24V
    - macro: '{$OIL.LOW.BAR}'
      value: '1.5'
      description: Low oil pressure trip while running (bar)
    - macro: '{$FUEL.LOW.WARN.PCT}'
      value: '50'
      description: Fuel level warning (%)
    - macro: '{$FUEL.LOW.CRIT.PCT}'
      value: '25'
      description: Fuel level critical NFPA 110 (%)
    - macro: '{$COOLANT.HIGH.C}'
      value: '98'
      description: Coolant high temp warn (°C J1939)
    - macro: '{$COOLANT.CRIT.C}'
      value: '104'
      description: Coolant shutdown temp (°C J1939)
    - macro: '{$EARTH.FAULT.A}'
      value: '5'
      description: Earth fault current threshold (A)
    - macro: '{$SERVICE.LOW.HOURS.WARN}'
      value: '50'
      description: Service hours-remaining warn
    - macro: '{$SERVICE.LOW.HOURS.CRIT}'
      value: '10'
      description: Service hours-remaining critical
    items:
    - uuid: f8d2b07845ef4d48a04e23bac71d6f44
      name: 'Status: Engine state'
      type: HTTP_AGENT
      key: influxdb.generator.engine_state
      url: '{$INFLUX.URL}/api/v2/query'
      query_fields:
      - name: org
        value: '{$INFLUX.ORG}'
      request_method: POST
      post_type: RAW
      posts: from(bucket:"hvac") |> range(start:-3m) |> filter(fn:(r) => r._measurement=="generator"
        and r.host=="{$INFLUX.HOST}" and r._field=="engine_state") |> last() |> keep(columns:["_value"])
      headers:
      - name: Authorization
        value: Token {$INFLUX.TOKEN}
      - name: Content-Type
        value: application/vnd.flux
      delay: 1m
      history: 31d
      trends: 365d
      value_type: UNSIGNED
      units: ''
      tags:
      - tag: class
        value: generator
      - tag: vendor
        value: comap
      - tag: subsystem
        value: status
      - tag: source
        value: influxdb
      preprocessing:
      - type: REGEX
        parameters:
        - ',_result,\d+,([-0-9.eE]+)'
        - \1
      valuemap:
        name: ComAp Engine State
