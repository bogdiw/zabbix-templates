        keep(columns:["_value"])
      headers:
      - name: Authorization
        value: Token {$INFLUX.TOKEN}
      - name: Content-Type
        value: application/vnd.flux
      delay: 1m
      history: 31d
      trends: 365d
      value_type: FLOAT
      units: kW
      tags:
      - tag: class
        value: generator
      - tag: vendor
        value: comap
      - tag: subsystem
        value: generator
      - tag: source
        value: influxdb
      preprocessing:
      - type: REGEX
        parameters:
        - ',_result,\d+,([-0-9.eE]+)'
        - \1
    valuemaps:
    - uuid: 048442bef4244d84bb71d94f1b27693d
      name: ComAp Engine State
      mappings:
      - value: '21'
        newvalue: Init
      - value: '22'
        newvalue: NotReady
      - value: '23'
        newvalue: Prestart
      - value: '24'
        newvalue: Cranking
      - value: '25'
        newvalue: Pause
      - value: '26'
        newvalue: Starting
      - value: '27'
        newvalue: Running
      - value: '28'
        newvalue: Loaded
      - value: '29'
        newvalue: Stop
      - value: '30'
        newvalue: Shutdown
      - value: '31'
        newvalue: Ready
      - value: '32'
        newvalue: Cooling
      - value: '33'
        newvalue: EmergMan
      - value: '34'
        newvalue: MainsOper
      - value: '35'
        newvalue: MainsFlt
      - value: '36'
        newvalue: IslOper
      - value: '37'
        newvalue: MainsRet
      - value: '38'
        newvalue: BrksOff
      - value: '39'
        newvalue: NoTimer
      - value: '40'
        newvalue: MCBClose
      - value: '41'
        newvalue: ReturnDel
      - value: '42'
        newvalue: TransDel
      - value: '43'
        newvalue: IdleRun
      - value: '44'
        newvalue: MinStabTO
      - value: '45'
        newvalue: MaxStabTO
      - value: '46'
        newvalue: AfterCool
      - value: '47'
        newvalue: GCBOpen
      - value: '48'
        newvalue: StopValve
      - value: '49'
        newvalue: StartDel
      - value: '50'
        newvalue: 1Ph
      - value: '51'
        newvalue: 3PD
      - value: '52'
        newvalue: 3PY
      - value: '53'
        newvalue: MRSMode
    - uuid: fcf08df19b4f46a0a4a3e90a32c08599
      name: ComAp Breaker State
      mappings:
      - value: '0'
        newvalue: Unknown
      - value: '1'
        newvalue: BothOpen
      - value: '2'
        newvalue: MainsClosed-GenOpen
      - value: '3'
        newvalue: MainsOpen-GenClosed
      - value: '4'
        newvalue: BothClosedParallel
      - value: '34'
        newvalue: ReadyStandby
      - value: '35'
        newvalue: MainsNormal
      - value: '36'
        newvalue: GenSupplyingLoad
  triggers:
  - uuid: 11aaebb0b4d649edba846da2bd5b23d0
    expression: nodata(/ComAp InteliLite by Modbus/influxdb.generator.engine_state,15m)=1
    name: 'Generator: Modbus poller unreachable on {HOST.NAME}'
    priority: HIGH
    description: No Modbus data for 15 min. Could be IB-Lite client-limit contention
      or panel reboot. Genset itself may still be fine — Telegraf has independent
      visibility.
    manual_close: 'YES'
  - uuid: e461382b2589405396c921e9f14f09c5
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.engine_rpm)>({$GEN.NOMINAL.RPM}*{$GEN.OVERSPEED.PCT}/100)
    name: 'Generator: Overspeed shutdown on {HOST.NAME}'
    priority: DISASTER
    description: Engine speed exceeded {$GEN.OVERSPEED.PCT}% of nominal RPM. Mechanical
      risk.
    manual_close: 'YES'
  - uuid: 0d6d67e6963542e8994babe7f78bcd04
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)>=27
      and last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)<=28 and
      last(/ComAp InteliLite by Modbus/influxdb.generator.engine_rpm)>1200 and last(/ComAp
      InteliLite by Modbus/influxdb.generator.oil_pressure_bar)<{$OIL.LOW.BAR}
    name: 'Generator: Low oil pressure while running on {HOST.NAME}'
    priority: DISASTER
    description: Oil pressure {ITEM.LASTVALUE} bar < {$OIL.LOW.BAR} bar while engine
      running. Bearing seizure risk.
    manual_close: 'YES'
  - uuid: 1e36fc2ceb3e4ca9b43b05660bb0c567
    expression: bitand(last(/ComAp InteliLite by Modbus/influxdb.generator.bin_inputs),4)=4
    name: 'Generator: Low coolant level on {HOST.NAME}'
    priority: DISASTER
    description: Low coolant level sensor active (bin_inputs bit 2). NFPA 110 critical.
    manual_close: 'YES'
  - uuid: 46b7750907984b00bf7845a5130f4d17
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.battery_voltage)<{$BATT.LOW.CRIT}
      and last(/ComAp InteliLite by Modbus/influxdb.generator.battery_voltage)>5
    name: 'Generator: Battery voltage critically low on {HOST.NAME}'
    priority: HIGH
    description: Battery {ITEM.LASTVALUE}V < {$BATT.LOW.CRIT}V. Cannot crank — genset
      may fail to start. Not in-flight emergency; downgraded from Disaster.
    manual_close: 'YES'
  - uuid: 20cbc93227394689a7a811e2371d7905
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.mains_voltage_l1n)<({$GEN.NOMINAL.V.LN}*0.85)
      and last(/ComAp InteliLite by Modbus/influxdb.generator.mains_voltage_l2n)<({$GEN.NOMINAL.V.LN}*0.85)
      and last(/ComAp InteliLite by Modbus/influxdb.generator.mains_voltage_l3n)<({$GEN.NOMINAL.V.LN}*0.85)
    name: 'Generator: Mains failure detected on {HOST.NAME}'
    priority: HIGH
    description: All 3 mains phases < 85% of nominal. AMF should start the genset.
    manual_close: 'YES'
  - uuid: 629e21c06cc44b6f85497566ea163412
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.earth_fault_a)>{$EARTH.FAULT.A}
    name: 'Generator: Earth fault current on {HOST.NAME}'
    priority: HIGH
    description: Earth fault {ITEM.LASTVALUE}A > {$EARTH.FAULT.A}A. Insulation fault
      on alternator or load.
    manual_close: 'YES'
  - uuid: b901de102b1c4d798bea6e09dc38f745
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.fuel_level_pct)<{$FUEL.LOW.CRIT.PCT}
      and last(/ComAp InteliLite by Modbus/influxdb.generator.fuel_level_pct)>=0
    name: 'Generator: Fuel level critically low on {HOST.NAME}'
    priority: HIGH
    description: Fuel {ITEM.LASTVALUE}% < {$FUEL.LOW.CRIT.PCT}% (NFPA 110 critical).
      Refill now.
    manual_close: 'YES'
  - uuid: 1daf75495d6241f183fa575623a31a6a
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.battery_voltage)<{$BATT.LOW.WARN}
      and last(/ComAp InteliLite by Modbus/influxdb.generator.battery_voltage)>={$BATT.LOW.CRIT}
      and last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)<24
    name: 'Generator: Battery low (engine stopped) on {HOST.NAME}'
    priority: HIGH
    description: Battery {ITEM.LASTVALUE}V (engine stopped). Charger may be failing.
    manual_close: 'YES'
  - uuid: cf5870d05eb54ea1813a460040603ff7
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.ecu_coolant_temp_c)>{$COOLANT.HIGH.C}
      and last(/ComAp InteliLite by Modbus/influxdb.generator.ecu_coolant_temp_c)<200
    name: 'Generator: ECU coolant temperature high on {HOST.NAME}'
    priority: HIGH
    description: Coolant {ITEM.LASTVALUE}°C > {$COOLANT.HIGH.C}°C (only valid if J1939
      ECU connected).
    manual_close: 'YES'
  - uuid: 48d6cd42d55e4888ac2aeb96f905e63a
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)=28
      and last(/ComAp InteliLite by Modbus/influxdb.generator.engine_rpm)<({$GEN.NOMINAL.RPM}*{$GEN.UNDERSPEED.PCT}/100)
    name: 'Generator: Underspeed while loaded on {HOST.NAME}'
    priority: HIGH
    description: Engine RPM < {$GEN.UNDERSPEED.PCT}% of nominal while Loaded. Governor
      or fuel issue.
    manual_close: 'YES'
  - uuid: b39a139cdc754f80991ca5946375ea2f
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)=22
      or last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)=21
    name: 'Generator: NOT in AUTO mode on {HOST.NAME}'
    priority: WARNING
    description: Engine state Init/NotReady. Check controller mode switch — genset
      will not auto-start.
    manual_close: 'YES'
  - uuid: dca445590ba74300b6cafddb5e5141ab
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.fuel_level_pct)<{$FUEL.LOW.WARN.PCT}
      and last(/ComAp InteliLite by Modbus/influxdb.generator.fuel_level_pct)>={$FUEL.LOW.CRIT.PCT}
    name: 'Generator: Fuel level low on {HOST.NAME}'
    priority: WARNING
    description: Fuel {ITEM.LASTVALUE}% < {$FUEL.LOW.WARN.PCT}%. Schedule refill.
    manual_close: 'YES'
  - uuid: 76a383feed2b4f84bce9b69b7721d5ca
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.battery_voltage)>{$BATT.HIGH}
    name: 'Generator: Battery overvoltage on {HOST.NAME}'
    priority: WARNING
    description: Battery {ITEM.LASTVALUE}V > {$BATT.HIGH}V. Charger may be faulty.
    manual_close: 'YES'
  - uuid: c6c158178d014509bda69c404a39cd0a
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.service_basic_h)<{$SERVICE.LOW.HOURS.CRIT}
      or last(/ComAp InteliLite by Modbus/influxdb.generator.service_lvl2_h)<{$SERVICE.LOW.HOURS.CRIT}
      or last(/ComAp InteliLite by Modbus/influxdb.generator.service_lvl3_h)<{$SERVICE.LOW.HOURS.CRIT}
    name: 'Generator: Service due (any timer critically low) on {HOST.NAME}'
    priority: WARNING
    description: A service interval has < {$SERVICE.LOW.HOURS.CRIT}h remaining. Schedule
      maintenance.
    manual_close: 'YES'
  - uuid: 684568072be2410aa6d4ad908dad9852
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)>=24
      and last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)<=28 and
      last(/ComAp InteliLite by Modbus/influxdb.generator.mains_voltage_l1n)>({$GEN.NOMINAL.V.LN}*0.9)
    name: 'Generator: Unscheduled run on {HOST.NAME}'
    priority: WARNING
    description: Engine running while mains is healthy. Verify scheduled test or manual
      run.
    manual_close: 'YES'
  - uuid: 70b3cd53ff2d49958a0b950da2a45e4c
    expression: last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)=32
      or last(/ComAp InteliLite by Modbus/influxdb.generator.engine_state)=46
    name: 'Generator: Cooling cycle active on {HOST.NAME}'
    priority: INFO
    description: Engine in Cooling/AfterCool state. Cool-down sequence underway.
    manual_close: 'YES'

