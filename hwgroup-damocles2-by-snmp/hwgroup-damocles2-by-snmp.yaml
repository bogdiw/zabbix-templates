zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: 4f3a8b2c1d5e4a7b9c8d6e2f1a0b3c4d
      name: Templates/HVAC
  templates:
    - uuid: b6d949e8e9dd4f18ad25a33486b222d4
      template: 'HW Group Damocles2 by SNMP'
      name: 'HW Group Damocles2 by SNMP'
      description: |
        STUB. HW Group Damocles2 (Mini and full) fire/sensor panel via SNMPv2c.

        Damocles2 ships with SNMP DISABLED by default. Enable on the device first
        (Web UI -> System -> SNMP) before populating items.

        Once SNMP is enabled, items should be generated from DAMOCLES-MIB
        (HW Group OID base 1.3.6.1.4.1.21796.4) using mib2zabbix:
            mib2zabbix -o 1.3.6.1.4.1.21796.4 -n Damocles2 > items.yaml

        Inventory:
          .204  CentralaDetectie01-PL  RO-PLO-S01
          .207  (TBD name — not in Excel inventory; reachable from cluster)

        Until SNMP is enabled: use Template Module ICMP Ping for availability only.
      groups:
        - name: Templates/HVAC
      macros:
        - macro: '{$SNMP_COMMUNITY}'
          value: 'public'
          description: 'SNMPv2c community — change after enabling SNMP on device'
